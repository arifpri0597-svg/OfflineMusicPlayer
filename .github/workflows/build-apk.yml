name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Verify Gradle Wrapper & Project Structure
        run: |
          echo "=== Verifying Project Structure ==="
          ls -la
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper not found at repository root."
            exit 1
          fi
          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar not found at gradle/wrapper/."
            exit 1
          fi
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "=== Restoring debug.keystore from debug.keystore.base64 ==="
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              echo "=== Generating standard Android debug.keystore ==="
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -startdate "2020/01/01 00:00:00" \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          echo "=== Setting gradlew execute permissions ==="
          chmod +x ./gradlew
          ./gradlew --version

      - name: Clean Stale Build Outputs
        run: |
          rm -rf app/build build .build-outputs

      - name: Build Release and Debug APKs
        run: |
          ./gradlew clean testDebugUnitTest assembleRelease verifyReleaseApk assembleDebug verifyDebugApk --no-build-cache --no-configuration-cache --stacktrace

      - name: Verify APK Outputs (ZIP Integrity, Zipalign, Apksigner, Badging)
        run: |
          for APK_PATH in "app/build/outputs/apk/release/app-release.apk" "app/build/outputs/apk/debug/app-debug.apk"; do
            if [ ! -f "$APK_PATH" ]; then
              echo "ERROR: Expected APK not found at $APK_PATH"
              exit 1
            fi
            ls -lh "$APK_PATH"
            echo "=== Verifying ZIP Archive Integrity for $APK_PATH ==="
            unzip -t "$APK_PATH" > /dev/null
            ZIPALIGN_BIN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
            if [ -n "$ZIPALIGN_BIN" ]; then
              echo "=== Verifying APK Alignment with $ZIPALIGN_BIN ==="
              "$ZIPALIGN_BIN" -c -v 4 "$APK_PATH" | tail -n 10
            fi
            APKSIGNER_BIN=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
            if [ -n "$APKSIGNER_BIN" ]; then
              echo "=== Verifying APK Signature with $APKSIGNER_BIN ==="
              "$APKSIGNER_BIN" verify --min-sdk-version 21 --verbose --print-certs "$APK_PATH"
            fi
            AAPT2_BIN=$(find $ANDROID_HOME/build-tools -name "aapt2" | sort -V | tail -n 1)
            if [ -n "$AAPT2_BIN" ]; then
              echo "=== Verifying APK Badging with $AAPT2_BIN ==="
              "$AAPT2_BIN" dump badging "$APK_PATH" | head -n 30
            fi
          done

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureTune-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureTune-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 14

