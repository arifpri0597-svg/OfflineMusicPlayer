name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Gradle Wrapper & Project Structure
        run: |
          echo "=== Verifying Project Structure ==="
          ls -la
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper not found at repository root."
            exit 1
          fi
          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar not found at gradle/wrapper/."
            exit 1
          fi
          echo "=== Setting gradlew execute permissions ==="
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Output
        run: |
          echo "=== Locating built APK ==="
          find . -name "*.apk" -ls
          mkdir -p app/build/outputs/apk/debug/
          find . -name "*debug*.apk" -exec cp {} app/build/outputs/apk/debug/ \;
          echo "Verified APK output contents:"
          ls -la app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMusicPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
