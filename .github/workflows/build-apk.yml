name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Verify Gradle Wrapper & Project Structure
        run: |
          echo "=== Verifying Project Structure ==="
          ls -la
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper not found at repository root."
            exit 1
          fi
          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar not found at gradle/wrapper/."
            exit 1
          fi
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "=== Restoring debug.keystore from debug.keystore.base64 ==="
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "=== Generating standard Android debug.keystore ==="
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          echo "=== Setting gradlew execute permissions ==="
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Output
        run: |
          echo "=== Locating built APK ==="
          find . -name "*.apk" -ls
          mkdir -p app/build/outputs/apk/debug/
          find . -name "*debug*.apk" -exec cp {} app/build/outputs/apk/debug/ \;
          echo "Verified APK output contents:"
          ls -la app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: OfflineMusicPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
